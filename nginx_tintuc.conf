# =========================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR BACKEND WEB APP TIN TUC
# Vị trí trên VPS: /etc/nginx/sites-available/tintuc
# Đường dẫn symlink: /etc/nginx/sites-enabled/tintuc
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name backend.dantri24h.com; # Thay thế bằng domain VPS của bạn nếu cần

    location / {
        proxy_pass http://localhost:6969; # Cổng chạy NodeJS backend
        proxy_http_version 1.1;
        proxy_read_timeout 36000s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
